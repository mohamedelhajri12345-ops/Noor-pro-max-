name: Noor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: noor-web-dist
          path: dist

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Validate Android project
        working-directory: android
        run: gradle --no-daemon tasks --stacktrace
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Assemble release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease --stacktrace
      - name: Assemble release AAB
        working-directory: android
        run: gradle --no-daemon bundleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

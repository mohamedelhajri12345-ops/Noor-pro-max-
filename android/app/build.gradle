plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.noorpromax'
    compileSdk 35

    defaultConfig {
        applicationId 'com.noorpromax'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.1.0'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'com.startapp:inapp-sdk:5.+'
}
